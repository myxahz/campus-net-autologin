name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明「使用场景」与「期望效果」，而不仅是结论。

        ⚠️ 本项目**仅适配北京交通大学**校园网，且**仅支持 Windows**。其它学校、其它平台（Linux / macOS）的适配不属于本项目目标。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题 / 什么场景
      placeholder: 我在 …… 时，遇到了 ……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 可选。例如改用别的探测方式、手动执行某个步骤等。
    validations:
      required: false
